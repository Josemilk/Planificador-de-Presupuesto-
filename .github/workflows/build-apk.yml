name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          set -o pipefail
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: chmod +x ./gradlew && ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: abaco-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 15
